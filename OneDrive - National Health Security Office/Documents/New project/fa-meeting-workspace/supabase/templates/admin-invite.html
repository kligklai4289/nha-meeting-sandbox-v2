<!doctype html>
<html lang="th">
  <body>
    <h1>คำเชิญผู้ดูแลระบบ</h1>
    <p>คุณได้รับคำเชิญให้ตั้งรหัสผ่านสำหรับระบบประชุมกลุ่มย่อย</p>
    <p>
      การเปิดหน้าจากลิงก์นี้ยังไม่ยืนยันคำเชิญ ระบบจะดำเนินการต่อเมื่อคุณกดปุ่ม
      “ยืนยันดำเนินการ” บนหน้าที่ยืนยันเท่านั้น
    </p>
    <p>
      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=invite">ยืนยันคำเชิญผู้ดูแลระบบ</a>
    </p>
    <p>หากคุณไม่ได้คาดว่าจะได้รับอีเมลนี้ ไม่ต้องดำเนินการใด ๆ</p>
  </body>
</html>
